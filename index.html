<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Valeurs de repli servies aux agents qui n'exécutent pas le JavaScript
      (GPTBot, ClaudeBot, PerplexityBot, aperçus LinkedIn et Facebook).
      Le composant src/seo/Seo.jsx les remplace par route à l'exécution.

      Ne PAS remettre ici de <link rel="canonical"> ni de <meta property="og:url">.
      vercel.json réécrit toutes les routes vers ce fichier, donc une canonique
      figée déclare à Google que /audit est un doublon de l'accueil. C'était la
      cause de l'état « Détectée, actuellement non indexée » relevé le 3 août 2026.
      La canonique est émise par route dans Seo.jsx.
    -->
    <title>Automatisation PME Québec. CRM et outils connectés | CoreNode Systems</title>
    <meta
      name="description"
      content="Consultant en automatisation pour PME québécoises en services terrain. CRM, facturation et dispatch enfin connectés. Fini la ressaisie manuelle."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoreNode Systems" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="Automatisation PME Québec. CoreNode Systems" />
    <meta
      property="og:description"
      content="J'intègre tes outils (CRM, facturation, dispatch) pour que ta PME arrête de perdre des heures en travail manuel. Systèmes documentés, équipe autonome."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Automatisation PME Québec. CoreNode Systems" />
    <meta
      name="twitter:description"
      content="Consultant en automatisation et intégration d'outils pour PME québécoises en services terrain et métiers spécialisés."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://corenodesystems.com/#business",
        "name": "CoreNode Systems",
        "url": "https://corenodesystems.com",
        "description": "Consultant en automatisation opérationnelle et intégration d'outils pour PME québécoises en services terrain, construction et métiers spécialisés. Connexion CRM, facturation, dispatch et comptabilité ; systèmes documentés que l'équipe opère sans dépendance au consultant.",
        "email": "william@corenodesystems.com",
        "founder": {
          "@type": "Person",
          "name": "William Fomete",
          "jobTitle": "Solutions Architect",
          "sameAs": "https://www.linkedin.com/in/william-fomete"
        },
        "areaServed": {
          "@type": "State",
          "name": "Québec",
          "containedInPlace": {
            "@type": "Country",
            "name": "Canada"
          }
        },
        "serviceType": [
          "Automatisation des processus d'affaires",
          "Intégration CRM et facturation",
          "Automatisation des opérations de services terrain",
          "Infrastructure de gestion et tableaux de bord",
          "Intégration d'outils PME (n8n, QuickBooks, dispatch)"
        ],
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "QC",
          "addressCountry": "CA"
        },
        "knowsLanguage": ["fr-CA", "en-CA"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
