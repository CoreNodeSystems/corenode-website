    <!--
      Valeurs de repli servies aux agents qui n'exécutent pas le JavaScript
      (GPTBot, ClaudeBot, PerplexityBot, aperçus LinkedIn et Facebook).
      Le composant src/seo/Seo.jsx les remplace par route à l'exécution.

      Ne PAS remettre ici de <link rel="canonical">, <meta property="og:url"> ni
      <meta property="og:image"> : ce fichier sert de gabarit à toutes les pages.
      Une canonique figée déclarait à Google que /audit était un doublon de
      l'accueil (« Détectée, actuellement non indexée », août 2026). Ces balises
      sont écrites par page au build (scripts/prerender.mjs), puis tenues à jour
      par Seo.jsx dans le navigateur. Les polices sont auto-hébergées
      (src/main.jsx) : aucun appel à Google Fonts.
    -->
